<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="710" viewBox="0 0 1200 710" role="img">
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#f5f5ef"/><stop offset="1" stop-color="#e5eee9"/></linearGradient><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto-start-reverse"><path d="M1 1 L6 4 L1 7" fill="none" stroke="#628775" stroke-width="1.4"/></marker></defs>
<rect width="1200" height="710" rx="28" fill="url(#bg)"/><g font-family="Segoe UI,Arial,sans-serif" fill="#183a2e"><text x="56" y="60" font-size="15" fill="#628775" font-weight="600">COLLABORATION / FROM REQUEST TO RESULT</text><text x="56" y="110" font-size="36" fill="#183a2e" font-weight="600">Independent tasks. Direct conversations.</text><rect x="400" y="150" width="400" height="96" rx="16" fill="#193e30" stroke="#cbd9ce"/><text x="424" y="186" font-size="21" fill="#ffffff" font-weight="600">Main agent</text><text x="424" y="215" font-size="15" fill="#c1d6c8" font-weight="400">Split work · integrate findings</text><path d="M480 252 L240 312" fill="none" stroke="#628775" stroke-width="2" marker-end="url(#arrow)"/><path d="M720 252 L960 312" fill="none" stroke="#628775" stroke-width="2" marker-end="url(#arrow)"/><rect x="56" y="325" width="368" height="96" rx="16" fill="#ffffff" stroke="#cbd9ce"/><text x="80" y="361" font-size="21" fill="#183a2e" font-weight="600">Implementation agent</text><text x="80" y="390" font-size="15" fill="#597064" font-weight="400">Task · workspace · optional context</text><rect x="776" y="325" width="368" height="96" rx="16" fill="#ffffff" stroke="#cbd9ce"/><text x="800" y="361" font-size="21" fill="#183a2e" font-weight="600">Review agent</text><text x="800" y="390" font-size="15" fill="#597064" font-weight="400">Task · workspace · optional context</text><path d="M440 371 L760 371" marker-start="url(#arrow)" fill="none" stroke="#628775" stroke-width="2" marker-end="url(#arrow)"/><text x="477" y="350" font-size="18" fill="#183a2e" font-weight="600">Peer messages</text><text x="465" y="402" font-size="14" fill="#597064" font-weight="400">Questions · findings · corrections</text><rect x="340" y="472" width="520" height="96" rx="16" fill="#ffffff" stroke="#cbd9ce"/><text x="364" y="508" font-size="21" fill="#183a2e" font-weight="600">Live team context</text><text x="364" y="537" font-size="15" fill="#597064" font-weight="400">Members · responsibilities · capabilities · status</text><text x="56" y="610" font-size="15" fill="#628775" font-weight="600">WAIT</text><text x="142" y="610" font-size="20" fill="#183a2e" font-weight="600">Message / team change / user input* / timeout / closure</text><text x="56" y="647" font-size="17" fill="#597064" font-weight="400">A wake means there is something to handle. It does not mean all agents have finished.</text><text x="56" y="679" font-size="14" fill="#597064" font-weight="400">* User input wakes the main agent. Streaming tokens alone do not wake a wait.</text></g></svg>