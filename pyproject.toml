[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "praxis-agent"
version = "0.1.0"
description = "A small coding agent built while learning Python."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "charset-normalizer>=3.4,<4",
    "langfuse>=4,<5",
    "openai>=3.7,<4",
    "PyYAML>=6,<7",
    "mcp>=2.3,<3",
    "jsonschema>=4.26,<5",
    "httpx2>=2.10,<3",
    "jieba>=0.42,<1",
    "pydantic-monty==1.2.0",
    "rich>=13.9,<15",
    "textual>=1,<2",
    "pyperclip>=1.11,<2",
    "truststore>=0.10,<1; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest>=8.3"]

[project.scripts]
praxis = "praxis_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
praxis_agent = ["builtin_skills/*/SKILL.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
