[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "praxis-agent"
version = "0.1.0"
description = "A small coding agent built while learning Python."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langfuse>=4,<5",
    "openai>=3.7,<4",
    "truststore>=0.10,<1; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest>=8.3"]

[project.scripts]
praxis = "praxis_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
